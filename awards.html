  <style>
    .film-open{position:relative;display:block;width:100%;padding:0;border:0;background:none;color:inherit;cursor:pointer;text-align:inherit}
    .film-open video{display:block;width:100%;pointer-events:none}
    .film-open-hint{position:absolute;right:12px;bottom:12px;padding:7px 10px;border:1px solid rgba(255,255,255,.45);border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;letter-spacing:.12em;backdrop-filter:blur(8px)}
    .project-modal[hidden]{display:none}
    .project-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px}
    .project-modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(10px)}
    .project-dialog{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);width:min(1160px,94vw);max-height:90vh;overflow:auto;border:1px solid rgba(255,255,255,.16);background:#0b0b0b;color:#f7f7f7;box-shadow:0 30px 100px rgba(0,0,0,.55)}
    .project-media{display:flex;align-items:center;justify-content:center;min-height:420px;background:#000}
    .project-media video{display:block;width:100%;max-height:82vh;object-fit:contain;background:#000}
    .project-info{display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,4vw,58px)}
    .project-kicker{margin:0 0 16px;color:#aaa;font-size:10px;letter-spacing:.2em}
    .project-year{align-self:flex-start;margin:0 0 18px;padding:7px 15px;border:1px solid rgba(255,255,255,.42);border-radius:999px;color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em}
    .project-info h2{margin:0 0 12px;font-size:clamp(23px,2.7vw,40px);line-height:1.17;word-break:keep-all}
    .project-award{margin:0 0 30px;color:#ddd;font-size:15px;line-height:1.5}
    .project-award:empty{display:none}
    .project-meta{margin:0}
    .project-meta>div{display:grid;grid-template-columns:105px 1fr;gap:14px;padding:15px 0;border-top:1px solid rgba(255,255,255,.13)}
    .project-meta>div:last-child{border-bottom:1px solid rgba(255,255,255,.13)}
    .project-meta dt{font-size:12px;font-weight:700;white-space:nowrap}
    .project-meta dd{margin:0;color:#ccc;font-size:13px;line-height:1.7}
    .project-close{position:absolute;top:14px;right:14px;z-index:2;width:40px;height:40px;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:23px;line-height:1;cursor:pointer}
    body.modal-open{overflow:hidden}
    @media(max-width:760px){.project-modal{padding:12px}.project-dialog{grid-template-columns:1fr;width:min(96vw,560px);max-height:92vh}.project-media{min-height:auto}.project-media video{max-height:53vh}.project-info{padding:26px 22px 32px}.project-meta>div{grid-template-columns:1fr;gap:7px}.film-open-hint{font-size:9px}}
  </style>

  <script src="app.js"></script>
  <script>
    (() => {
      const modal = document.getElementById('award-detail');
      if (!modal) return;
      const modalVideo = modal.querySelector('video');
      const modalSource = modalVideo.querySelector('source');
      const title = modal.querySelector('#project-modal-title');
      const year = modal.querySelector('.project-year');
      const award = modal.querySelector('.project-award');
      const tools = modal.querySelector('.project-tools');
      const role = modal.querySelector('.project-role');
      const closeButton = modal.querySelector('.project-close');
      let lastButton = null;
      const closeModal = () => {
        modalVideo.pause();
        modal.hidden = true;
        document.body.classList.remove('modal-open');
        if (lastButton) lastButton.focus();
      };
      document.querySelectorAll('.film-open').forEach((button) => {
        button.addEventListener('click', () => {
          lastButton = button;
          title.textContent = button.dataset.title;
          year.textContent = button.dataset.year;
          award.textContent = button.dataset.award;
          tools.textContent = button.dataset.tools;
          role.textContent = button.dataset.role;
          modalSource.src = button.dataset.video;
          modalVideo.load();
          modal.hidden = false;
          document.body.classList.add('modal-open');
          closeButton.focus();
        });
      });
      modal.querySelectorAll('[data-close-project]').forEach((button) => button.addEventListener('click', closeModal));
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !modal.hidden) closeModal(); });
    })();
  </script>
